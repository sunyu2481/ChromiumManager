name: Sync Chromium Binaries

on:
  schedule:
    - cron: '0 4 * * 1'   # 每周一 4:00 UTC 自动检查
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get adryfish latest version
        id: upstream
        run: |
          RELEASE=$(curl -sf https://api.github.com/repos/adryfish/fingerprint-chromium/releases/latest)
          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Upstream latest: $TAG"

      - name: Check if already synced
        id: check
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          [ "$STATUS" = "200" ] && echo "Already synced." || echo "New version, will sync."

      # amd64: 从 adryfish 获取最新版，转换压缩格式 xz→gz（Dockerfile 用 *.tar.gz 通配）
      - name: Download and repackage amd64
        if: steps.check.outputs.status != '200'
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          curl -L --retry 3 -o chromium_x86_64.tar.xz \
            "https://github.com/adryfish/fingerprint-chromium/releases/download/${TAG}/ungoogled-chromium-${TAG}-1-x86_64_linux.tar.xz"
          xz -d chromium_x86_64.tar.xz
          gzip -9 chromium_x86_64.tar
          mv chromium_x86_64.tar.gz "ungoogled-chromium-${TAG}-1-amd64_linux.tar.gz"
          echo "amd64 done: $(ls -lh ungoogled-chromium-*-amd64_linux.tar.gz)"

      # arm64: adryfish 从未提供 arm64，暂时使用 vtumi 最新 release 的 arm64 包。
      # 版本号与 amd64 不同是正常的——Docker 多架构构建时各平台独立使用对应包。
      - name: Download arm64 from vtumi (last known arm64 source)
        if: steps.check.outputs.status != '200'
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          ARM64_URL=$(curl -sf https://api.github.com/repos/vtumi/ChromiumManager/releases/latest \
            | jq -r '.assets[] | select(.name | test("arm64")) | .browser_download_url')
          if [ -z "$ARM64_URL" ]; then
            echo "WARNING: could not find vtumi arm64 asset, skipping arm64"
          else
            curl -L --retry 3 -o "ungoogled-chromium-${TAG}-1-arm64_linux.tar.gz" "$ARM64_URL"
            echo "arm64 done (from vtumi): $(ls -lh ungoogled-chromium-*-arm64_linux.tar.gz)"
          fi

      - name: Create release and upload
        if: steps.check.outputs.status != '200'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: "Chromium ${{ steps.upstream.outputs.tag }}"
          body: |
            Auto-synced.

            - **amd64**: repackaged from [adryfish/fingerprint-chromium ${{ steps.upstream.outputs.tag }}](https://github.com/adryfish/fingerprint-chromium/releases/tag/${{ steps.upstream.outputs.tag }})
            - **arm64**: from vtumi/ChromiumManager latest release (version may differ — arm64 has no active upstream yet)
          files: ungoogled-chromium-*.tar.gz

      # 同步完成后自动触发 Docker 镜像构建
      - name: Trigger Docker build
        if: steps.check.outputs.status != '200'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/docker-image.yml/dispatches" \
            -d '{"ref":"main"}'
