name: Docker Image CI

on:
  push:
    branches:
      - main
  workflow_dispatch:   # 供 sync-chromium.yml 在同步到新版 chromium 后触发

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download chromium binary from latest release
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          fileName: 'ungoogled-chromium-*_linux.tar.gz'
          out-file-path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chromium-manager:latest
            ghcr.io/${{ github.repository_owner }}/chromium-manager:${{ github.sha }}
